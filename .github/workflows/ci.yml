name: CI and release

# Every push and pull request runs the checks. A pushed v* tag also publishes
# to the Comfy Registry, but only after both check jobs pass.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMFY_CLI_VERSION: "1.23.0"
  RUFF_VERSION: "0.17.2"
  # Oldest ComfyUI this pack declares in requires-comfyui.
  COMFYUI_REF: v0.38.0
  # The template's Audio Visualizer release.
  AUDIOVISUALIZER_REF: v0.2.0
  # The template's ABC Preview release, with the timeline.
  ABCPREVIEW_REF: v0.3.0

jobs:
  checks:
    name: Metadata, security scan and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - name: Registry metadata (comfy node validate)
        run: |
          pip install "comfy-cli==$COMFY_CLI_VERSION" "ruff==$RUFF_VERSION"
          comfy --skip-prompt --no-enable-telemetry env
          comfy node validate
      - name: Security scan as errors
        # comfy-cli only warns about exec, eval and one-line multi-statements
        # for now and says these will become errors; fail on them already.
        run: ruff check . --select S102,S307,E702
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Frontend unit tests
        run: node --test tests/*.mjs

  comfyui:
    name: Loads in ComfyUI (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: pack
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ComfyUI with CPU PyTorch
        run: |
          git clone --depth 1 --branch "$COMFYUI_REF" https://github.com/Comfy-Org/ComfyUI.git comfyui
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r comfyui/requirements.txt
          cp -r pack comfyui/custom_nodes/ComfyUI-YuE2-Kit
          git clone --depth 1 --branch "$AUDIOVISUALIZER_REF" https://github.com/bno84/ComfyUI-AudioVisualizer.git comfyui/custom_nodes/ComfyUI-AudioVisualizer
          git clone --depth 1 --branch "$ABCPREVIEW_REF" https://github.com/bno84/ComfyUI-ABCPreview.git comfyui/custom_nodes/ComfyUI-ABCPreview
      - name: Start ComfyUI and check the pack
        run: >
          python pack/.github/scripts/comfyui_smoke.py comfyui
          --pack ComfyUI-YuE2-Kit --cnr-id comfyui-yue2-kit
          --node bno84.SaveYuE2Bundle --node bno84.YuE2ExtendABC
          --node bno84.OptionalLoadAudio --node bno84.ReferenceInput --node bno84.LyricsStyle
          --node bno84.CheckpointFile --node bno84.OptionalAudioEncoderFile
          --node bno84.OptionalLoraFile --node bno84.ModelStatus
          --route /extensions/ComfyUI-YuE2-Kit/audio_widgets.js
          --route /extensions/ComfyUI-YuE2-Kit/legacy_bypass.js
          --route /extensions/ComfyUI-YuE2-Kit/lyrics_style.js
          --route /extensions/ComfyUI-YuE2-Kit/model_status.js
          --route /extensions/ComfyUI-YuE2-Kit/reference_input.js
          --route /extensions/ComfyUI-YuE2-Kit/reference_transcribe.js
          --workflow pack/example_workflows/yue2-kit-song.json

      - name: Reference routes in three model layouts (CPU, mocked model calls)
        run: python pack/.github/scripts/reference_routes_check.py comfyui pack

  publish:
    name: Publish to the Comfy Registry
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, comfyui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Changelog from the tag message
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:subject)%0a%0a%(contents:body)' > changelog.md
          cat changelog.md
      - name: Publish
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          pip install "comfy-cli==$COMFY_CLI_VERSION" "ruff==$RUFF_VERSION"
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN" --changelog-file changelog.md
